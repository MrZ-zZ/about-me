<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>子栖 · 兼职/私活任务筛选器</title>
<style>
:root{color-scheme:dark;--bg:#101127;--panel:rgba(30,32,60,.86);--panel2:rgba(20,22,46,.9);--line:rgba(167,139,250,.26);--text:#eef0ff;--muted:#b7bce0;--accent:#a78bfa;--accent2:#60a5fa;--good:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:radial-gradient(circle at 82% 12%,rgba(96,165,250,.18),transparent 32%),radial-gradient(circle at 18% 88%,rgba(167,139,250,.18),transparent 34%),linear-gradient(135deg,#0d0e24,#141735 52%,#0b0d20)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);background-size:110px 110px;opacity:.18;animation:drift 24s linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-110px)}}
.wrap{position:relative;z-index:1;width:min(1180px,94vw);margin:0 auto;padding:40px 0 60px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(167,139,250,.12);color:#e7ddff;font-size:13px}
h1{margin:16px 0 10px;font-size:clamp(30px,5vw,54px);letter-spacing:2px;line-height:1.08;background:linear-gradient(90deg,#fff,#d8c8ff 45%,#8ec7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:720px;margin:0;color:var(--muted);line-height:1.8}
.panel{margin-top:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.34);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:18px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
label{display:grid;gap:7px;font-size:12px;color:var(--muted)}
select,input{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(10,12,30,.74);color:var(--text);font:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,.14)}
.summary{display:flex;flex-wrap:wrap;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.stat{padding:11px 14px;border-radius:12px;background:var(--panel2);border:1px solid rgba(167,139,250,.16)}
.stat small{color:var(--muted);font-size:12px}
.stat strong{display:block;margin-top:5px;font-size:18px;color:var(--accent2)}
.list{display:grid;gap:12px;padding:18px;max-height:620px;overflow:auto}
.card{padding:16px;border:1px solid rgba(167,139,250,.2);border-radius:16px;background:var(--panel2)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card h3{margin:0;font-size:17px;line-height:1.45}
.price{font-weight:800;color:var(--accent2);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tag{padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.13);color:#d4d6ee;font-size:11px}
.tag.warn{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:#ffe08a}
.tag.good{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#a7f3d0}
.tag.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3);color:#fecdd3}
.desc{margin:10px 0 0;color:var(--muted);line-height:1.7;font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:16px 18px;border-top:1px solid var(--line)}
button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#17123a;font-weight:700;cursor:pointer;transition:transform .16s ease,filter .16s ease}
button:hover{transform:translateY(-2px);filter:brightness(1.05)}
button.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)}
.hint{margin-top:10px;color:var(--muted);font-size:12px;text-align:right}
@media(max-width:640px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">✦ 合成数据 · 仅作品集展示</span>
    <h1>兼职 / 私活任务筛选器</h1>
    <p class="sub">用报价区间、风险词和需求明确度给任务打分，帮助自由职业者快速筛掉低质量需求。本页只展示筛选逻辑，不提供任何真实平台抓取入口。</p>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>接单优先级工作台</h2>
      <span class="hint" style="margin:0">打分维度：预算 + 需求明确度 - 风险词</span>
    </div>
    <div class="filters">
      <label>风险级别
        <select id="risk"><option value="全部">全部</option><option value="低">低</option><option value="中">中</option><option value="高">高</option></select>
      </label>
      <label>最低预算（元）
        <input id="minBudget" type="number" value="0" min="0" step="100" />
      </label>
      <label>关键词
        <input id="keyword" type="search" placeholder="如：数据分析、Excel、爬虫" />
      </label>
      <label>排序
        <select id="sort"><option value="score">优先级从高到低</option><option value="budget">预算从高到低</option></select>
      </label>
    </div>

    <div class="summary" id="summary"></div>
    <div class="list" id="list"></div>
    <div class="actions">
      <button id="exportCsv" type="button">导出筛选结果 CSV</button>
      <button id="reset" type="button" class="ghost">重置筛选</button>
    </div>
    <p class="hint">导出内容均为虚构任务数据，仅用于演示筛选、评分与交付流程。</p>
  </section>
</div>

<script>
const raw=[
  ["Excel 数据清洗与透视表交付","600","低","数据分析","需求明确，已提供样例表格。","Excel,Python,数据清洗"],
  ["电商销售周报自动生成脚本","900","低","自动化","每周自动汇总 CSV 并输出图表。","Python,自动化,报表"],
  ["公开商品价格采集与阈值提醒","1200","中","数据采集","需本地运行，来源仅限公开页面。","Python,定时任务,数据采集"],
  ["医院经营数据可视化大屏","2200","低","数据可视化","提供脱敏数据，需交付 HTML 看板。","Python,pyecharts,大屏"],
  ["短视频批量剪辑流水线","1500","中","自动化","处理授权素材，按分镜表生成成片。","FFmpeg,自动化,AIGC"],
  ["PDF 简历批量转结构化表格","700","低","办公自动化","从固定模板提取字段，导出 Excel。","Python,PDF,Excel"],
  ["某平台验证码识别接口","2000","高","接口与风控","要求绕过登录限制，暂不展示可运行入口。","验证码,接口,风控"],
  ["抢票脚本与并发下单","1800","高","自动化","高频并发，存在合规风险，仅做技术说明。","并发,脚本,风控"],
  ["公众号文章批量抓取","800","中","数据采集","仅用于学习总结，不提供真实数据。","爬虫,文本处理"],
  ["数据库字段清洗与迁移","1300","低","数据工程","从旧表迁移到新表，保留审计日志。","SQL,Python,数据清洗"]
].map((x,i)=>({id:i+1,title:x[0],budget:+x[1],risk:x[2],type:x[3],desc:x[4],tags:x[5].split(",")}));

function score(t){
  let s=0;
  s+=Math.min(60,Math.round(t.budget/1000*25));
  const desc=t.desc;
  if(desc.includes("样例")||desc.includes("脱敏")||desc.includes("明确")) s+=20;
  if(t.risk==="低") s+=20; else if(t.risk==="中") s+=8; else s-=25;
  return s;
}
function filter(){
  const risk=document.getElementById("risk").value;
  const min=Number(document.getElementById("minBudget").value||0);
  const kw=document.getElementById("keyword").value.trim();
  const sort=document.getElementById("sort").value;
  let rows=raw.filter(t=>
    (risk==="全部"||t.risk===risk)&&
    t.budget>=min&&
    (!kw||(t.title+t.type+t.tags.join(" ")+t.desc).includes(kw))
  );
  rows=rows.map(t=>({...t,score:score(t)}));
  rows.sort((a,b)=>sort==="budget"?b.budget-a.budget:b.score-a.score);
  return rows;
}
function riskClass(r){return r==="低"?"good":r==="中"?"warn":"bad"}
function render(){
  const rows=filter();
  document.getElementById("summary").innerHTML=`
    <div class="stat"><small>匹配任务</small><strong>${rows.length} 条</strong></div>
    <div class="stat"><small>平均预算</small><strong>¥${rows.length?Math.round(rows.reduce((s,t)=>s+t.budget,0)/rows.length):0}</strong></div>
    <div class="stat"><small>高风险任务</small><strong>${rows.filter(t=>t.risk==="高").length} 条</strong></div>`;
  const list=document.getElementById("list");list.innerHTML="";
  rows.forEach(t=>{
    const div=document.createElement("div");div.className="card";
    div.innerHTML=`
      <div class="card-top">
        <div><h3>${t.title}</h3><div class="meta">
          <span class="tag ${riskClass(t.risk)}">风险：${t.risk}</span>
          <span class="tag">${t.type}</span>
          ${t.tags.map(x=>'<span class="tag">'+x+'</span>').join("")}
          <span class="tag ${t.score>=40?"good":"bad"}">优先级 ${t.score}</span>
        </div></div>
        <div class="price">¥${t.budget}</div>
      </div>
      <p class="desc">${t.desc}</p>`;
    list.appendChild(div);
  });
  if(!rows.length) list.innerHTML='<div class="card"><p class="desc" style="text-align:center">没有符合条件的合成任务。</p></div>';
}
function exportCsv(){
  const rows=filter();
  const head="任务,预算,风险,类型,说明,标签,优先级\n";
  const body=rows.map(t=>[t.title,t.budget,t.risk,t.type,t.desc,t.tags.join("|"),t.score].join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+head+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="接单任务筛选_脱敏演示.csv";a.click();
}
["risk","minBudget","keyword","sort"].forEach(id=>document.getElementById(id).addEventListener(id==="keyword"?"input":"change",render));
document.getElementById("exportCsv").addEventListener("click",exportCsv);
document.getElementById("reset").addEventListener("click",()=>{
  document.getElementById("risk").value="全部";
  document.getElementById("minBudget").value=0;
  document.getElementById("keyword").value="";
  document.getElementById("sort").value="score";
  render();
});
render();
</script>
</body>
</html>
