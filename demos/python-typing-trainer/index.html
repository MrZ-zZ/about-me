<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>子栖 · Python 词汇打字闯关</title>
<style>
:root{--bg:#080d17;--panel:rgba(16,25,44,.88);--panel2:#0d1524;--line:rgba(148,163,184,.22);--text:#f3f7ff;--muted:#93a4bd;--cyan:#54d6ff;--blue:#7c9dff;--green:#3ddc97;--amber:#ffd166;--red:#ff6b81;--purple:#b58cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(84,214,255,.16),transparent 26rem),radial-gradient(circle at 90% 12%,rgba(181,140,255,.14),transparent 28rem),radial-gradient(circle at 50% 100%,rgba(61,220,151,.09),transparent 30rem),var(--bg);min-height:100vh;padding:24px}
.wrap{width:min(980px,100%);margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#05131d;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 10px 24px rgba(84,214,255,.22)}
h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:1px}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.04);color:var(--muted);font-size:12px}
.view{display:none}
.view.active{display:block;animation:viewIn .28s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.28)}
.hero{padding:24px;background:radial-gradient(circle at 100% 0,rgba(84,214,255,.16),transparent 20rem),linear-gradient(150deg,rgba(20,34,61,.95),rgba(10,17,31,.92))}
.hero h2{margin:0;font-size:24px}
.hero p{margin:8px 0 0;color:var(--muted);line-height:1.7}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.mode{text-align:left;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--panel2);color:var(--text);cursor:pointer;transition:border-color .18s,transform .18s,background .18s;font:inherit}
.mode:hover{transform:translateY(-2px);border-color:var(--blue)}
.mode.selected{border-color:var(--cyan);background:linear-gradient(145deg,rgba(84,214,255,.10),rgba(124,157,255,.10));box-shadow:0 0 0 1px rgba(84,214,255,.12)}
.mode b{display:block;font-size:15px;margin-bottom:8px}
.mode span{color:var(--muted);font-size:12px;line-height:1.6}
.actions{margin-top:16px;display:flex;gap:10px}
button.primary{border:0;border-radius:14px;padding:12px 20px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#05131d;font-weight:800;cursor:pointer;font:inherit}
button.ghost{border:1px solid var(--line);border-radius:14px;padding:12px 20px;background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font:inherit}
.game-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.game-head .mode-name{color:var(--cyan);font-weight:700}
.game-head .meta{color:var(--muted);font-size:12px;display:flex;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--cyan)}
.stat span{color:var(--muted);font-size:11px}
.play-area{padding:24px;text-align:center}
.word-card{font-family:Consolas,monospace;font-size:clamp(34px,7vw,58px);letter-spacing:2px;color:var(--green);text-shadow:0 0 24px rgba(61,220,151,.22);min-height:72px}
.hint{color:var(--muted);font-size:13px;margin:16px 0 10px}
input.answer{width:min(560px,92%);border:1px solid var(--line);border-radius:16px;background:#070d18;color:#fff;padding:15px 18px;font:700 20px Consolas,monospace;text-align:center;outline:none}
input.answer.correct{border-color:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.12)}
input.answer.wrong{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,107,129,.12)}
.feedback{min-height:26px;margin-top:12px;color:var(--muted)}
.progress{height:8px;margin:18px auto 0;max-width:560px;border-radius:999px;background:#0b1422;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .3s}
.result{padding:30px;text-align:center}
.grade{font-size:clamp(54px,12vw,96px);font-weight:900;background:linear-gradient(135deg,var(--amber),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.result-grid .item{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px}
.result-grid b{display:block;font-size:26px;color:var(--amber)}
.result-grid span{color:var(--muted);font-size:12px}
.wrong-list{text-align:left;border-top:1px solid var(--line);padding-top:16px;margin-top:8px;color:var(--muted)}
@media(max-width:700px){.modes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">Py</div><div><h1>Python 词汇打字闯关</h1><p class="sub">原创词库 · 本地进度 · 错词重练 · 三种训练模式</p></div></div>
    <span class="pill">LOCAL ONLY</span>
  </header>

  <section class="view active" id="homeView">
    <div class="panel hero">
      <h2>选择训练模式</h2>
      <p>用键盘输入 Python 词汇，训练拼写准确率和反应速度。所有进度只保存在当前浏览器。</p>
      <div class="modes" id="modeList">
        <button class="mode selected" data-mode="base"><b>基础词汇</b><span>print、input、if、for 等高频词</span></button>
        <button class="mode" data-mode="syntax"><b>语法进阶</b><span>class、lambda、try、except 等语法词</span></button>
        <button class="mode" data-mode="mixed"><b>综合挑战</b><span>混合词库，错词会进入重练队列</span></button>
      </div>
      <div class="actions"><button class="primary" id="startBtn">开始训练</button><button class="ghost" id="resetBtn">清空本地进度</button></div>
    </div>
  </section>

  <section class="view" id="gameView">
    <div class="panel">
      <div class="game-head"><span class="mode-name" id="modeName">基础词汇</span><span class="meta"><span>得分 <b id="statScore">0</b></span><span>正确率 <b id="statAccuracy">0%</b></span><span>进度 <b id="statProgress">0/0</b></span></span></div>
      <div class="stats">
        <div class="stat"><b id="statRound">0</b><span>当前题号</span></div>
        <div class="stat"><b id="statStreak">0</b><span>连击</span></div>
        <div class="stat"><b id="statMistakes">0</b><span>待重练</span></div>
        <div class="stat"><b id="statWpm">0</b><span>WPM</span></div>
      </div>
      <div class="play-area">
        <div class="word-card" id="currentWord">ready</div>
        <p class="hint">输入上方词汇后按 Enter 确认</p>
        <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here..." />
        <div class="feedback" id="feedback"></div>
        <div class="progress"><i id="progressFill"></i></div>
      </div>
    </div>
  </section>

  <section class="view" id="resultView">
    <div class="panel result">
      <div class="grade" id="gradeText">A</div>
      <div id="gradeDesc"></div>
      <div class="result-grid">
        <div class="item"><b id="finalScore">0</b><span>最终得分</span></div>
        <div class="item"><b id="finalAccuracy">0%</b><span>正确率</span></div>
        <div class="item"><b id="finalWpm">0</b><span>WPM</span></div>
      </div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="actions" style="justify-content:center"><button class="primary" id="retryBtn">再练一次</button><button class="ghost" id="homeBtn">返回首页</button></div>
    </div>
  </section>
</div>

<script>
const wordBanks={
  base:["print","input","if","else","elif","for","while","def","return","import","list","dict","set","tuple","string","integer","float","boolean","none","range","len","type","str","int","open","read","write"],
  syntax:["class","object","method","module","package","exception","try","except","finally","with","lambda","yield","global","nonlocal","self","init","iter","next","zip","map","filter","reduce","super","isinstance","raise"],
  mixed:["print","input","if","else","for","while","def","class","lambda","try","except","with","list","dict","set","tuple","open","write","import","from","return","yield","range","len","type","str","int","float","none"]
};
const state={mode:"base",queue:[],score:0,round:0,total:0,correct:0,mistakes:[],streak:0,maxStreak:0,wpm:0,startTime:0};
function save(){localStorage.setItem("python-typing-trainer-v2",JSON.stringify(state));}
function load(){const s=localStorage.getItem("python-typing-trainer-v2");if(s){try{Object.assign(state,JSON.parse(s));}catch(e){}}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function setView(name){["homeView","gameView","resultView"].forEach(id=>document.getElementById(id).classList.toggle("active",id===name));}
function showGame(){
  state.queue=shuffle([...wordBanks[state.mode]]);
  state.score=0;state.round=0;state.total=0;state.correct=0;state.mistakes=[];state.streak=0;state.maxStreak=0;state.wpm=0;state.startTime=performance.now();
  document.getElementById("modeName").textContent={base:"基础词汇",syntax:"语法进阶",mixed:"综合挑战"}[state.mode];
  setView("gameView");nextWord();
}
function nextWord(){
  if(!state.queue.length){
    if(state.mistakes.length)state.queue=shuffle([...state.mistakes]);
    else{finish();return;}
    state.mistakes=[];
  }
  document.getElementById("currentWord").textContent=state.queue[0];
  const input=document.getElementById("answer");input.value="";input.className="answer";document.getElementById("feedback").textContent="";
  document.getElementById("progressFill").style.width=Math.round(((state.total-state.queue.length)/Math.max(1,state.total+state.queue.length))*100)+"%";
  updateHud();
}
function updateHud(){
  document.getElementById("statScore").textContent=state.score;
  document.getElementById("statRound").textContent=state.round+1;
  document.getElementById("statAccuracy").textContent=state.total?Math.round(state.correct/state.total*100)+"%":"0%";
  document.getElementById("statProgress").textContent=(state.total-state.queue.length)+"/"+Math.max(1,state.total+state.queue.length);
  document.getElementById("statStreak").textContent=state.streak;
  document.getElementById("statMistakes").textContent=state.mistakes.length;
  document.getElementById("statWpm").textContent=state.wpm;
}
function check(){
  const input=document.getElementById("answer"),target=state.queue[0];if(!target)return;
  state.total++;state.round++;
  if(input.value.trim().toLowerCase()===target.toLowerCase()){
    state.correct++;state.streak++;state.maxStreak=Math.max(state.maxStreak,state.streak);
    state.score+=10+Math.max(0,8-input.value.length);state.queue.shift();
    input.className="answer correct";document.getElementById("feedback").textContent="正确";
  }else{
    state.streak=0;if(!state.mistakes.includes(target))state.mistakes.push(target);
    input.className="answer wrong";document.getElementById("feedback").textContent="拼写错误，已加入重练";
  }
  const mins=(performance.now()-state.startTime)/60000;state.wpm=mins>0?Math.max(0,Math.round(state.correct/mins)):0;
  updateHud();save();setTimeout(nextWord,350);
}
function finish(){
  const acc=state.total?Math.round(state.correct/state.total*100):0;
  const score=state.score;
  let grade="C",desc="继续积累，重点复习错词。";
  if(acc>=95&&state.maxStreak>=8){grade="S";desc="稳定高效，具备很强的 Python 词汇基础。";}
  else if(acc>=85){grade="A";desc="表现优秀，保持这个节奏继续训练。";}
  else if(acc>=70){grade="B";desc="基础不错，错词重练后会有明显提升。";}
  document.getElementById("gradeText").textContent=grade;
  document.getElementById("gradeDesc").textContent=desc;
  document.getElementById("finalScore").textContent=score;
  document.getElementById("finalAccuracy").textContent=acc+"%";
  document.getElementById("finalWpm").textContent=state.wpm;
  document.getElementById("wrongList").innerHTML=state.mistakes.length?("<b>本次错词</b><br/>"+state.mistakes.join("、")):"本次没有错词。";
  setView("resultView");save();
}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");state.mode=b.dataset.mode;save();}));
document.getElementById("startBtn").addEventListener("click",showGame);
document.getElementById("retryBtn").addEventListener("click",showGame);
document.getElementById("homeBtn").addEventListener("click",()=>setView("homeView"));
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check();});
document.getElementById("resetBtn").addEventListener("click",()=>{localStorage.removeItem("python-typing-trainer-v2");Object.assign(state,{mode:"base",queue:[],score:0,round:0,total:0,correct:0,mistakes:[],streak:0,maxStreak:0,wpm:0,startTime:0});setView("homeView");});
load();if(state.queue.length){document.getElementById("modeName").textContent={base:"基础词汇",syntax:"语法进阶",mixed:"综合挑战"}[state.mode]||"基础词汇";nextWord();}
</script>
</body>
</html>
