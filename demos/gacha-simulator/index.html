<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>子栖 · 盲盒抽卡系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,rgba(255,215,100,.28),transparent 24%),radial-gradient(circle at 12% 18%,rgba(118,79,255,.35),transparent 28%),radial-gradient(circle at 88% 26%,rgba(0,153,255,.22),transparent 26%),linear-gradient(145deg,#070914 0%,#10142a 46%,#05060d 100%)}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,black 0%,transparent 70%);pointer-events:none}
.beam{position:fixed;left:50%;top:-8%;width:430px;height:120vh;transform:translateX(-50%) scaleX(.2);background:linear-gradient(90deg,transparent 0%,rgba(255,210,66,.08) 16%,rgba(255,247,160,.56) 50%,rgba(255,210,66,.08) 84%,transparent 100%);opacity:0;pointer-events:none;z-index:20;will-change:transform,opacity}
body.ssr-mode .beam{background:linear-gradient(90deg,transparent 0%,rgba(180,120,255,.10) 16%,rgba(205,150,255,.62) 50%,rgba(180,120,255,.10) 84%,transparent 100%);animation:beamShow 2.2s ease-out forwards}
body.ur-mode .beam{background:linear-gradient(90deg,transparent 0%,rgba(255,210,66,.08) 16%,rgba(255,247,160,.56) 50%,rgba(255,210,66,.08) 84%,transparent 100%);animation:beamShow 2.2s ease-out forwards}
@keyframes beamShow{0%{opacity:0;transform:translateX(-50%) scaleX(.2)}45%{opacity:1;transform:translateX(-50%) scaleX(1.05)}100%{opacity:.72;transform:translateX(-50%) scaleX(.86)}}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.particle{position:absolute;will-change:transform,opacity;width:var(--size);height:var(--size);left:var(--left);top:var(--top);border-radius:50%;background:radial-gradient(circle,#fff7b8 0%,#ffd84d 42%,rgba(255,216,77,0) 76%);box-shadow:0 0 12px rgba(255,223,87,.9);opacity:0;animation:sparkle var(--duration) ease-in-out var(--delay) infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:translateY(0) scale(.5)}35%{opacity:1;transform:translateY(-16px) scale(1.15)}70%{opacity:.45;transform:translateY(-34px) scale(.8)}}
.game-page{position:relative;z-index:5;width:min(1280px,96vw);margin:0 auto;padding:36px 18px 44px}
.header{text-align:center;margin-bottom:24px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid rgba(255,221,111,.45);border-radius:999px;background:rgba(255,213,74,.08);color:#ffe78a;font-size:14px;letter-spacing:1px;box-shadow:0 0 28px rgba(255,211,79,.12)}
h1{margin-top:14px;font-size:52px;letter-spacing:8px;text-shadow:0 0 18px rgba(255,217,79,.65),0 0 42px rgba(255,153,0,.35)}
.subtitle{margin-top:10px;color:rgba(255,255,255,.72);font-size:15px}
.stage{max-width:1180px;margin:0 auto;padding:26px;border:1px solid rgba(255,255,255,.12);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:0 24px 80px rgba(0,0,0,.45),inset 0 0 60px rgba(255,255,255,.035);contain:layout paint;transform:translateZ(0)}
.top-grid{display:grid;grid-template-columns:1fr 1.7fr;gap:20px;margin-bottom:22px}
.panel{border-radius:24px;padding:20px;background:rgba(4,7,18,.62);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 0 28px rgba(255,255,255,.025)}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#ffeaa2;font-weight:700;letter-spacing:1px}
.actions{display:flex;flex-direction:column;gap:10px}
.actions button{border:0;padding:13px 18px;border-radius:16px;background:linear-gradient(135deg,#ffd54d,#ff9f1c);color:#241400;font-weight:800;cursor:pointer;font-size:16px;box-shadow:0 10px 24px rgba(255,180,30,.25)}
.actions button.ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.14)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:#ffe78a}
.stat span{color:#aeb9d8;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;perspective:1000px;contain:layout paint}
.card{position:relative;min-height:190px;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);animation:cardIn .55s both;animation-delay:var(--delay);transform:translateZ(0)}
@keyframes cardIn{0%{opacity:0;transform:translateY(28px) rotateY(45deg) scale(.72)}100%{opacity:1;transform:none}}
.card-inner{padding:18px;height:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.card-order{font-size:12px;color:rgba(255,255,255,.5)}
.card-rarity{font-size:12px;font-weight:800;letter-spacing:2px}
.card-name{font-size:20px;font-weight:900;margin-top:10px}
.card-label{font-size:12px;color:rgba(255,255,255,.58);margin-top:6px}
.card.R{border-color:rgba(150,165,190,.28)}
.card.SR{border-color:rgba(103,232,249,.55);box-shadow:0 0 24px rgba(34,211,238,.22);background:linear-gradient(160deg,#13344a,#0e2337)}
.card.SSR{border-color:rgba(190,120,255,.85);box-shadow:0 0 42px rgba(168,85,247,.6),inset 0 0 32px rgba(205,150,255,.18);background:linear-gradient(160deg,#3b1c5c,#150b26);animation:rareIn .7s both;animation-delay:var(--delay)}
.card.UR{border-color:rgba(255,210,80,.85);box-shadow:0 0 42px rgba(255,190,40,.55),inset 0 0 32px rgba(255,220,90,.16);background:linear-gradient(160deg,#41300b,#191306);animation:rareIn .7s both;animation-delay:var(--delay)}
@keyframes rareIn{0%{filter:brightness(2);transform:scale(.55) rotateY(55deg)}55%{filter:brightness(1.6);transform:scale(1.14) rotateY(0)}100%{filter:brightness(1);transform:scale(1)}}
.card.R .card-rarity{color:#9ca3af}.card.SR .card-rarity{color:#67e8f9}.card.SSR .card-rarity{color:#c084fc}.card.UR .card-rarity{color:#ffd66b}
.pool{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:22px}
.pool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pool-card{display:flex;justify-content:space-between;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:.35s}
.pool-card.removed{opacity:.28;text-decoration:line-through;transform:scale(.95);border-color:rgba(255,255,255,.05)}
.history{max-height:250px;overflow:auto;padding-right:6px}
.history-item{display:flex;justify-content:space-between;gap:12px;padding:11px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.history-item span:last-child{font-weight:800}
.ssr-modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:.2s}
.ssr-modal.show{opacity:1;pointer-events:auto}
.modal-card{transform:scale(.6);transition:.3s;padding:30px;border-radius:28px;text-align:center;background:linear-gradient(160deg,#3b1c5c,#140b26);border:1px solid #c084fc;box-shadow:0 0 70px rgba(168,85,247,.65);color:#fff}.modal-card.ur{background:linear-gradient(160deg,#4b390b,#140f04);border-color:#ffd66b;box-shadow:0 0 70px rgba(255,190,40,.65)}
.ssr-modal.show .modal-card{transform:scale(1)}
.modal-card .star{font-size:70px;color:#e9d5ff;text-shadow:0 0 30px #c084fc}.modal-card.ur .star{color:#ffe78a;text-shadow:0 0 30px #ffd66b}
.modal-card h2{font-size:34px;margin:10px 0 6px;letter-spacing:4px;color:#e9d5ff}
.modal-card p{color:#d7c4ff}.modal-card.ur p{color:#cbb16c}.modal-card.ur h2{color:#ffe78a}
@media(max-width:900px){.top-grid,.pool{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:36px;letter-spacing:4px}.particles,.beam{display:none}}
@media (prefers-reduced-motion: reduce){.particle,.beam,.card{animation:none!important}}
</style>
</head>
<body>
<div class="beam"></div>
<div class="particles" id="particles"></div>
<main class="game-page">
  <header class="header">
    <span class="badge">✦ 原创抽卡模拟器</span>
    <h1>盲盒抽卡系统</h1>
    <p class="subtitle">模拟概率权重、十连抽、稀有度光效与本地存档；SSR 触发紫光，UR 触发金光。</p>
  </header>

  <section class="stage">
    <div class="top-grid">
      <div class="panel">
        <div class="panel-title"><span>抽卡控制台</span><span>random.choice</span></div>
        <div class="actions">
          <button id="singleBtn">单抽 · draw(1)</button>
          <button id="tenBtn">十连抽 · draw(10)</button>
          <button class="ghost" id="resetBtn">重置奖池</button>
        </div>
        <div class="stats">
          <div class="stat"><b id="statR">0</b><span>R 普通</span></div>
          <div class="stat"><b id="statSR">0</b><span>SR 稀有</span></div>
          <div class="stat"><b id="statSSR">0</b><span>SSR 史诗</span></div>
          <div class="stat"><b id="statUR">0</b><span>UR 传说</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title"><span>本次结果</span><span id="drawRound">等待抽卡</span></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div class="pool">
      <div class="panel">
        <div class="panel-title"><span>当前奖池</span><span id="remainCount">10 / 10</span></div>
        <div class="pool-grid" id="poolGrid"></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span>抽卡记录</span><span id="historyCount">0</span></div>
        <div class="history" id="history"></div>
      </div>
    </div>
  </section>
</main>

<div class="ssr-modal" id="ssrModal">
  <div class="modal-card">
    <div class="star">✦</div>
    <h2 id="modalName">SSR 降临</h2>
    <p id="modalText">紫色光束已触发，稀有角色从奖池中消失。</p>
  </div>
</div>

<script>
const basePool=[
  {name:"普通",rarity:"R",w:60,label:"基础角色"},
  {name:"稀有",rarity:"SR",w:25,label:"进阶角色"},
  {name:"史诗",rarity:"SSR",w:11,label:"高光角色"},
  {name:"传说",rarity:"UR",w:4,label:"终极角色"}
];
let pool=[],stat={R:0,SR:0,SSR:0,UR:0},round=0;
function load(){
  try{const s=JSON.parse(localStorage.getItem("gacha-high")||"null");if(s&&s.pool&&s.pool.length){pool=s.pool;stat=s.stat;round=s.round;return;}}catch(e){}
  reset();
}
function save(){localStorage.setItem("gacha-high",JSON.stringify({pool,stat,round}));}
function reset(){
  pool=basePool.map(x=>({...x}));
  stat={R:0,SR:0,SSR:0,UR:0};
  round=0;
  document.getElementById("cards").innerHTML='<div class="card R" style="--delay:0s"><div class="card-inner"><div class="card-order">READY</div><div class="card-name">等待抽卡</div><div class="card-label">点击单抽或十连抽</div></div></div>';
  save();renderPool();renderStats();renderHistory();
}
function pick(){
  let total=pool.reduce((s,c)=>s+c.w,0);
  let x=Math.random()*total;
  for(let i=0;i<pool.length;i++){x-=pool[i].w;if(x<=0)return i;}
  return pool.length-1;
}
function draw(n){
  if(!pool.length)reset();
  let html="",ssrHit=false,urHit=false,ssrItem=null,urItem=null;
  for(let i=0;i<n;i++){
    if(!pool.length)pool=basePool.map(x=>({...x}));
    const idx=pick(),item=pool[idx];
    stat[item.rarity]++;
    round++;
    pool[idx].w--;
    if(item.rarity==="SSR"){ssrHit=true;ssrItem=item;}
    if(item.rarity==="UR"){urHit=true;urItem=item;}
    html+='<div class="card '+item.rarity+'" style="--delay:'+(i*.22)+'s"><div class="card-inner"><div><div class="card-order">#'+round+'</div><div class="card-rarity">'+item.rarity+'</div></div><div><div class="card-name">'+item.name+'</div><div class="card-label">'+item.label+'</div></div></div></div>';
    addHistory(item,round);
  }
  pool=pool.filter(c=>c.w>0);
  document.getElementById("cards").innerHTML=html;
  document.getElementById("drawRound").textContent=urHit?"UR 传说 · 金光降临":ssrHit?"SSR 史诗 · 紫光降临":"第 "+round+" 轮";
  document.body.classList.toggle("ssr-mode",ssrHit);
  document.body.classList.toggle("ur-mode",urHit);
  setTimeout(()=>{document.body.classList.remove("ssr-mode");document.body.classList.remove("ur-mode");},2400);
  const modalQueue=[];
  if(ssrHit)modalQueue.push(["SSR 史诗",ssrItem?.name||"史诗"]);
  if(urHit)modalQueue.push(["UR 传说",urItem?.name||"传说"]);
  modalQueue.forEach((entry,index)=>setTimeout(()=>showModal(entry[0],entry[1]),index*1450));
  renderPool();renderStats();renderHistory();save();
}
function renderStats(){
  document.getElementById("statR").textContent=stat.R;
  document.getElementById("statSR").textContent=stat.SR;
  document.getElementById("statSSR").textContent=stat.SSR;
  document.getElementById("statUR").textContent=stat.UR;
}
function renderPool(){
  const grid=document.getElementById("poolGrid");
  grid.innerHTML=pool.map(c=>'<div class="pool-card"><span>'+c.name+' · '+c.rarity+'</span><b>×'+c.w+'</b></div>').join("")||'<div class="pool-card removed"><span>奖池已清空</span><b>0</b></div>';
  const remain=pool.reduce((s,c)=>s+c.w,0);
  document.getElementById("remainCount").textContent=remain+" / 10";
}
let history=[];
function addHistory(item,round){
  history.unshift({item,round});
  history=history.slice(0,30);
}
function renderHistory(){
  document.getElementById("historyCount").textContent=history.length;
  document.getElementById("history").innerHTML=history.map(h=>'<div class="history-item"><span>#'+h.round+' '+h.item.name+'</span><span style="color:'+rarityColor(h.item.rarity)+'">'+h.item.rarity+'</span></div>').join("")||'<p style="color:#aeb9d8">暂无记录</p>';
}
function rarityColor(r){return r==="R"?"#9ca3af":r==="SR"?"#67e8f9":r==="SSR"?"#c084fc":"#ffd66b";}
function showModal(rarity,name){
  const isSSR=rarity.indexOf("SSR")===0;
  document.getElementById("modalName").textContent=rarity+" · "+name;
  const card=document.querySelector(".modal-card");card.className="modal-card"+(isSSR?" ssr":" ur") ;
  card.style.background=isSSR?"linear-gradient(160deg,#3b1c5c,#140b26)":"linear-gradient(160deg,#4b390b,#140f04)";
  card.style.borderColor=isSSR?"#c084fc":"#ffd66b";
  card.style.boxShadow=isSSR?"0 0 70px rgba(168,85,247,.65)":"0 0 70px rgba(255,190,40,.65)";
  document.getElementById("modalText").textContent=isSSR?"紫色光束已触发，稀有角色从奖池中消失。":"金色光束已触发，稀有角色从奖池中消失。";
  document.getElementById("modalName").style.color=isSSR?"#e9d5ff":"#ffe78a";
  document.getElementById("modalText").style.color=isSSR?"#d7c4ff":"#cbb16c";
  document.getElementById("ssrModal").classList.add("show");
  setTimeout(()=>document.getElementById("ssrModal").classList.remove("show"),1300);
}
function spawnParticles(){
  const box=document.getElementById("particles");box.innerHTML="";
  for(let i=0;i<14;i++){
    const p=document.createElement("div");p.className="particle";
    p.style.setProperty("--left",Math.random()*100+"%");
    p.style.setProperty("--top",Math.random()*100+"%");
    p.style.setProperty("--delay",(Math.random()*4).toFixed(2)+"s");
    p.style.setProperty("--duration",(3+Math.random()*5).toFixed(2)+"s");
    p.style.setProperty("--size",(2+Math.random()*5)+"px");
    box.appendChild(p);
  }
}
document.getElementById("singleBtn").addEventListener("click",()=>draw(1));
document.getElementById("tenBtn").addEventListener("click",()=>draw(10));
document.getElementById("resetBtn").addEventListener("click",reset);
document.getElementById("ssrModal").addEventListener("click",e=>{if(e.target.id==="ssrModal")e.target.classList.remove("show");});
spawnParticles();load();renderPool();renderStats();renderHistory();
</script>
</body>
</html>
