<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>子栖 · 招聘市场数据看板</title>
<style>
:root{--bg:#070b14;--panel:rgba(15,23,42,.85);--panel2:rgba(17,26,44,.9);--line:rgba(148,163,184,.22);--text:#e6edf7;--muted:#8ea2bf;--cyan:#22d3ee;--purple:#a855f7;--green:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(34,211,238,.12),transparent 28rem),radial-gradient(circle at 85% 18%,rgba(168,85,247,.14),transparent 30rem),linear-gradient(145deg,#070b14,#0b1222 55%,#070b14);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:36px 20px 64px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(34,211,238,.45);border-radius:999px;background:rgba(34,211,238,.08);color:#7deffd;font-size:13px}
h1{margin:12px 0 8px;font-size:34px}
.sub{max-width:760px;margin:0;color:var(--muted);line-height:1.85}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:20px;box-shadow:0 24px 70px rgba(2,6,23,.45);backdrop-filter:blur(12px)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.panel-title{font-weight:700;color:#cfe9ff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:15px}
.kpi b{display:block;font-size:24px;color:#7deffd}
.kpi span{color:var(--muted);font-size:12px}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
label{color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px}
select,input{background:#0a111f;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:10px 12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(90deg,#0891b2,#7c3aed);color:#fff;font-weight:700;cursor:pointer}
button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;animation:fade .3s both}
.job:hover{border-color:var(--cyan);transform:translateY(-2px);transition:.2s}
.job h3{margin:0 0 8px;font-size:17px}
.job p{margin:4px 0;color:var(--muted);font-size:13px}
.tag{display:inline-block;margin-right:5px;margin-top:6px;padding:4px 8px;border-radius:8px;font-size:11px;background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.25);color:#7deffd}
.chart{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar-row{display:grid;grid-template-columns:110px 1fr 72px;gap:8px;align-items:center;margin:7px 0}
.bar{height:8px;border-radius:999px;background:#101b30;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a855f7)}
.pie{height:14px;border-radius:999px;background:#101b30;overflow:hidden;display:flex;margin-top:8px}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.muted{color:var(--muted)}
@media(max-width:850px){.chart{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Python 思路 · 合成招聘数据</span>
  <h1>招聘市场数据看板</h1>
  <p class="sub">对本地合成岗位数据做清洗、筛选与聚合，展示城市、技能、薪资、远程占比等市场结构。数据均为虚构，不代表任何真实平台。</p>

  <section class="panel">
    <div class="panel-head"><span class="panel-title">筛选条件</span><span id="count" class="muted"></span></div>
    <div class="toolbar">
      <label>城市<select id="city"><option value="">全部</option></select></label>
      <label>技能<select id="skill"><option value="">全部</option></select></label>
      <label>远程支持<select id="remote"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></label>
      <label>最低薪资<input id="salary" type="number" min="0" placeholder="如 10000" /></label>
      <label>关键词<input id="keyword" placeholder="岗位名称或技能" /></label>
    </div>
    <div class="actions">
      <button id="resetBtn">重置筛选</button>
      <button class="ghost" id="exportJson">导出 JSON</button>
      <button class="ghost" id="exportCsv">导出 CSV</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><span class="panel-title">市场指标</span><span>合成数据</span></div>
    <div class="kpis">
      <div class="kpi"><b id="kCount">0</b><span>样本岗位</span></div>
      <div class="kpi"><b id="kAvg">0</b><span>平均月薪</span></div>
      <div class="kpi"><b id="kMedian">0</b><span>中位数月薪</span></div>
      <div class="kpi"><b id="kRemote">0%</b><span>支持远程</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><span class="panel-title">结构分析</span><span class="muted">城市与技能平均月薪</span></div>
    <div class="chart">
      <div id="cityBars"></div>
      <div id="skillBars"></div>
    </div>
    <div class="pie" id="remotePie"></div>
    <div class="legend" id="remoteLegend"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><span class="panel-title">岗位明细</span><span id="listCount" class="muted"></span></div>
    <div class="grid" id="jobs"></div>
  </section>
</div>
<script>
const jobs=[
  {title:"Python 数据分析工程师",city:"成都",skill:"Python",salary:13000,remote:"否",degree:"本科"},
  {title:"医药数据运营",city:"成都",skill:"数据分析",salary:11500,remote:"是",degree:"本科"},
  {title:"数据可视化开发",city:"上海",skill:"Python",salary:18500,remote:"是",degree:"本科"},
  {title:"经营分析专员",city:"杭州",skill:"数据分析",salary:15000,remote:"否",degree:"本科"},
  {title:"Python 自动化工程师",city:"北京",skill:"Python",salary:21000,remote:"否",degree:"本科"},
  {title:"AI 内容策划",city:"深圳",skill:"AIGC",salary:17000,remote:"是",degree:"本科"},
  {title:"数据清洗专员",city:"成都",skill:"Python",salary:9800,remote:"是",degree:"大专"},
  {title:"医药信息沟通专员",city:"成都",skill:"药学",salary:10500,remote:"否",degree:"本科"},
  {title:"商业分析助理",city:"武汉",skill:"数据分析",salary:12500,remote:"否",degree:"本科"},
  {title:"数据产品实习生",city:"南京",skill:"数据分析",salary:8000,remote:"是",degree:"本科"},
  {title:"AIGC 视觉设计",city:"上海",skill:"AIGC",salary:16000,remote:"是",degree:"大专"},
  {title:"Python 后端开发",city:"深圳",skill:"Python",salary:22000,remote:"否",degree:"本科"}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function avg(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function unique(key){return [...new Set(jobs.map(x=>x[key]))];}
function populate(){["city","skill"].forEach(k=>{const sel=$(k);sel.innerHTML='<option value="">全部</option>'+unique(k).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");});}
function filtered(){const city=$("city").value,skill=$("skill").value,remote=$("remote").value,salary=+$("salary").value||0,key=$("keyword").value.trim().toLowerCase();return jobs.filter(x=>(!city||x.city===city)&&(!skill||x.skill===skill)&&(!remote||x.remote===remote)&&(!salary||x.salary>=salary)&&(!key||(x.title+" "+x.skill+" "+x.city).toLowerCase().includes(key)));}
function render(){const list=filtered(),sal=list.map(x=>x.salary),avgSal=avg(sal),medianSal=median(sal),remoteCount=list.filter(x=>x.remote==="是").length,remoteRate=list.length?Math.round(remoteCount/list.length*100):0;$("count").textContent="筛选结果 "+list.length+" 条";$("listCount").textContent=list.length+" 条";$("kCount").textContent=list.length;$("kAvg").textContent=list.length?Math.round(avgSal).toLocaleString():0;$("kMedian").textContent=list.length?Math.round(medianSal).toLocaleString():0;$("kRemote").textContent=remoteRate+"%";$("jobs").innerHTML=list.map(x=>'<article class="job"><h3>'+esc(x.title)+'</h3><p>'+esc(x.city)+' · '+esc(x.degree)+'</p><p>月薪 '+x.salary.toLocaleString()+' 元 · '+(x.remote==="是"?"支持远程":"现场办公")+'</p><div><span class="tag">'+esc(x.skill)+'</span><span class="tag">'+esc(x.city)+'</span></div></article>').join("")||'<p class="muted" style="grid-column:1/-1">没有符合条件的岗位</p>';renderBars("cityBars","city","城市",list);renderBars("skillBars","skill","技能",list);renderRemote(list);}
function group(arr,key){return arr.reduce((m,x)=>{const k=x[key];(m[k]=m[k]||[]).push(x);return m;},{});}
function renderBars(el,key,label,list){const groups=group(list,key);const items=Object.entries(groups).map(([k,v])=>({k,v:avg(v.map(x=>x.salary)),n:v.length})).sort((a,b)=>b.v-a.v);const max=items.length?Math.max(...items.map(x=>x.v)):1;$(el).innerHTML='<h3 class="panel-title">'+label+'平均月薪</h3>'+(items.map(it=>'<div class="bar-row"><span>'+esc(it.k)+'</span><div class="bar"><i style="width:'+Math.round(it.v/max*100)+'%"></i></div><b>'+Math.round(it.v).toLocaleString()+'</b></div>').join("")||'<p class="muted">暂无数据</p>');}
function renderRemote(list){const total=list.length,yes=list.filter(x=>x.remote==="是").length,yp=total?Math.round(yes/total*100):0,np=100-yp;$("remotePie").innerHTML='<div style="width:'+yp+'%;background:linear-gradient(90deg,#22d3ee,#34d399)"></div><div style="width:'+np+'%;background:#334155"></div>';$("remoteLegend").innerHTML='<span>支持远程 '+yp+'%</span><span>现场办公 '+np+'%</span>';}
function reset(){["city","skill","remote"].forEach(id=>$(id).value="");$("salary").value="";$("keyword").value="";render();}
populate();["city","skill","remote","salary","keyword"].forEach(id=>$(id).addEventListener("input",render));$("resetBtn").addEventListener("click",reset);
$("exportJson").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(filtered(),null,2)],{type:"application/json"}));a.download="recruitment-jobs.json";a.click();});
$("exportCsv").addEventListener("click",()=>{const rows=[["title","city","skill","salary","remote","degree"]].concat(filtered().map(x=>[x.title,x.city,x.skill,x.salary,x.remote,x.degree]));const csv=rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="recruitment-jobs.csv";a.click();});
render();
</script>
</body>
</html>
