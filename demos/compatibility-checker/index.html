<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>子栖 · 缘分检测器</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,rgba(255,122,180,.30),transparent 32%),radial-gradient(circle at 80% 10%,rgba(255,215,120,.18),transparent 28%),linear-gradient(135deg,#1a0b1f 0%,#351236 45%,#120a22 100%);transition:background .7s ease}
body.cool{background:radial-gradient(circle at 20% 20%,rgba(120,180,255,.22),transparent 26%),linear-gradient(135deg,#091827 0%,#162941 52%,#070d16 100%)}
body.normal{background:radial-gradient(circle at 20% 20%,rgba(255,188,130,.22),transparent 28%),linear-gradient(135deg,#1f1523 0%,#3b2534 52%,#120a16 100%)}
body.warm{background:radial-gradient(circle at 20% 20%,rgba(255,176,112,.34),transparent 30%),radial-gradient(circle at 80% 10%,rgba(255,105,180,.22),transparent 26%),linear-gradient(135deg,#2a1023 0%,#5a2440 50%,#180b22 100%)}
body.hot{background:radial-gradient(circle at 20% 20%,rgba(255,105,180,.52),transparent 30%),radial-gradient(circle at 80% 10%,rgba(255,80,140,.42),transparent 24%),linear-gradient(135deg,#2b071f 0%,#741849 50%,#1a0617 100%)}
body.ultimate{background:radial-gradient(circle at 20% 20%,rgba(255,225,120,.5),transparent 28%),radial-gradient(circle at 75% 15%,rgba(255,82,168,.55),transparent 30%),radial-gradient(circle at 50% 90%,rgba(255,255,255,.18),transparent 25%),linear-gradient(135deg,#2b1604 0%,#67163b 45%,#120716 100%)}
.particles{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:.85;will-change:transform,opacity}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg);opacity:0}}
.page{position:relative;z-index:10;width:min(1020px,92vw);margin:0 auto;padding:44px 0 54px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:9px 15px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(255,255,255,.08);letter-spacing:1px;font-size:13px}
h1{margin:20px 0 8px;font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-1px;text-shadow:0 0 24px rgba(255,96,178,.55)}
.sub{max-width:780px;color:rgba(255,255,255,.78);font-size:17px;line-height:1.8;margin:0}
.dashboard{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:34px}
.card{position:relative;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(255,255,255,.1);box-shadow:0 26px 70px rgba(0,0,0,.32);overflow:hidden}
.main-card{padding:34px;min-height:500px}
.main-card::before{content:"";position:absolute;inset:-2px;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent,rgba(255,115,190,.28));pointer-events:none}
body.hot .main-card{box-shadow:0 0 38px rgba(255,88,170,.48),0 30px 90px rgba(0,0,0,.38)}
body.ultimate .main-card{box-shadow:0 0 50px rgba(255,190,60,.55),0 0 70px rgba(255,82,168,.5),0 30px 90px rgba(0,0,0,.38)}
.names{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-bottom:28px;position:relative;z-index:1}
.person{padding:22px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.person span{display:block;color:rgba(255,255,255,.58);font-size:13px;margin-bottom:8px}
.person input{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:26px;font-weight:800;outline:none;padding:4px 0}
.heart{font-size:42px;animation:pulse 1.2s ease-in-out infinite;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25)}}
.score-zone{text-align:center;position:relative;z-index:1}
.score-num{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#ffd9a1);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(255,120,180,.4)}
.score-label{color:rgba(255,255,255,.7);margin-top:8px;letter-spacing:3px}
.gauge{height:16px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin:22px auto 0;max-width:520px;box-shadow:inset 0 0 12px rgba(0,0,0,.25)}
.gauge i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff7ab4,#ffd776,#fff2a6);box-shadow:0 0 18px rgba(255,150,190,.75);transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.actions{margin-top:26px}
.actions button{padding:13px 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff7ab4,#ffb070);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 30px rgba(255,95,160,.3)}
.side-card{padding:28px}
.side-card h2{font-size:22px;margin:0 0 16px}
.info-list{display:grid;gap:12px}
.info-item{background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px}
.info-item small{color:rgba(255,255,255,.5);display:block;font-size:12px;margin-bottom:5px}
.info-item b{font-size:14px;line-height:1.5}
.knowledge{margin-top:26px;padding:24px;border-radius:26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.knowledge h2{margin:0 0 14px;font-size:20px}
.knowledge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.k-item{background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px}
.k-item strong{color:#ffd9a1}
.k-item p{color:rgba(255,255,255,.68);font-size:13px;line-height:1.6;margin:7px 0 0}
@media(max-width:860px){.dashboard{grid-template-columns:1fr}.names{grid-template-columns:1fr}.knowledge-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.knowledge-grid{grid-template-columns:1fr}.score-num{font-size:70px}}
@media (prefers-reduced-motion: reduce){.particle,.heart,.gauge i{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<main class="page">
  <span class="badge">✦ 原创趣味工具</span>
  <h1>缘分检测器</h1>
  <p class="sub">输入两个名字，生成一个可复现的缘分指数、匹配等级与动态光效。</p>

  <div class="dashboard">
    <div class="card main-card" id="fateCard">
      <div class="names">
        <div class="person"><span>名字 A</span><input id="nameA" value="子栖" /></div>
        <div class="heart">❤</div>
        <div class="person"><span>名字 B</span><input id="nameB" value="菲儿" /></div>
      </div>
      <div class="score-zone">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-label" id="scoreLabel">等待检测</div>
        <div class="gauge"><i id="gaugeFill"></i></div>
        <div class="actions"><button id="runFate">生成缘分结果</button></div>
      </div>
    </div>
    <aside class="card side-card">
      <h2>分支判断</h2>
      <div class="info-list">
        <div class="info-item"><small>评分模型</small><b>稳定哈希生成可复现指数</b></div>
        <div class="info-item"><small>匹配等级</small><b>天选 / 心动 / 温暖 / 观察 多档</b></div>
        <div class="info-item"><small>视觉反馈</small><b>数字滚动、进度条与粒子光效</b></div>
        <div class="info-item"><small>当前等级</small><b id="levelOut">—</b></div>
      </div>
    </aside>
  </div>

  
</main>

<script>
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function levelFor(score){
  if(score>=90)return {cls:"ultimate",label:"天选组合",msg:"缘分爆表，触发金色粒子与天选组合徽章。"};
  if(score>=80)return {cls:"hot",label:"强烈心动",msg:"高糖预警，粉红粒子持续飘落。"};
  if(score>=60)return {cls:"warm",label:"温暖默契",msg:"关系升温，适合一起完成项目。"};
  if(score>=30)return {cls:"normal",label:"普通朋友",msg:"慢慢了解，缘分正在积累。"};
  return {cls:"cool",label:"娱乐观察区",msg:"有缘无分，遗憾退场。"};
}
let rafId=null;
function runFate(){
  const a=document.getElementById("nameA").value.trim()||"子栖";
  const b=document.getElementById("nameB").value.trim()||"菲儿";
  const target=hash(a+b)%100+1;
  const lv=levelFor(target);
  document.body.className=lv.cls;
  document.getElementById("fateCard").className="card main-card "+(target>=90?"ultimate-glow":target>=80?"hot-glow":"");
  document.getElementById("scoreLabel").textContent=lv.label+" · yf = "+target;
  document.getElementById("levelOut").textContent=lv.label;
  const num=document.getElementById("scoreNum"),gauge=document.getElementById("gaugeFill");
  gauge.style.width="0%";
  if(rafId)cancelAnimationFrame(rafId);
  const start=performance.now(),dur=1200;
  function tick(now){
    const p=Math.min((now-start)/dur,1),ease=1-Math.pow(1-p,3),v=Math.round(target*ease);
    num.textContent=v;
    if(p<1){rafId=requestAnimationFrame(tick);}else{num.textContent=target;gauge.style.width=target+"%";document.getElementById("scoreLabel").textContent=lv.msg;}
  }
  rafId=requestAnimationFrame(tick);
  spawnParticles(target);
}
function spawnParticles(score){
  const box=document.getElementById("particles");box.innerHTML="";
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const count=score>=90?18:score>=80?12:score>=60?7:3;
  const icons=score>=90?["💖","⭐","✨","💛","🌸"]:score>=80?["💖","✨","🌸"]:["✨","💫"];
  for(let i=0;i<count;i++){
    const p=document.createElement("div");p.className="particle";
    p.textContent=icons[i%icons.length];
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(4+Math.random()*3)+"s";
    p.style.animationDelay=(Math.random()*.7)+"s";
    p.style.fontSize=(18+Math.random()*20)+"px";
    box.appendChild(p);
    (function(node){setTimeout(()=>node.remove(),7500);})(p);
  }
}
document.getElementById("runFate").addEventListener("click",runFate);
runFate();
</script>
</body>
</html>
